<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1A3A5C"/>
<title>🦴 Fisioterapia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F5F9;color:#1A2332;font-size:16px}
input,textarea,select,button{font-family:inherit;font-size:16px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#C5D0DC;border-radius:4px}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden;position:relative}

/* SIDEBAR */
#sidebar{
  width:272px;min-width:272px;background:#1A3A5C;
  display:flex;flex-direction:column;overflow:hidden;
  transition:min-width .25s,width .25s;
  flex-shrink:0;
}
#sidebar.collapsed{width:0!important;min-width:0!important}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}

/* MOBILE */
@media(max-width:680px){
  #sidebar{
    position:fixed;inset:0;width:100%!important;min-width:100%!important;
    z-index:100;transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    padding-top:env(safe-area-inset-top);
  }
  #sidebar.mobile-open{transform:translateX(0)!important}
  #sidebar.collapsed{transform:translateX(-100%)!important}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
  #overlay.show{display:block}
  #mobile-topbar{display:flex!important}
  #bottom-nav{display:flex!important;padding-bottom:env(safe-area-inset-bottom)}
  #main{padding-bottom:56px}
  .desktop-only{display:none!important}
}
@media(min-width:681px){
  #mobile-topbar{display:none!important}
  #bottom-nav{display:none!important}
  .mobile-only{display:none!important}
}

#mobile-topbar{
  display:none;background:#1A3A5C;color:#fff;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  align-items:center;gap:12px;flex-shrink:0;
}
.hamburger{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px;line-height:1}

#bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid #E2E6EC;z-index:50;
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;border:none;background:transparent;cursor:pointer;
  font-size:10px;font-weight:600;color:#9AA3B0;gap:2px;
}
.bnav-btn.active{color:#1A3A5C}
.bnav-icon{font-size:20px;line-height:1.2}

/* SIDEBAR INNER */
#sidebar-header{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar-title{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
#sidebar-sub{color:rgba(255,255,255,.4);font-size:11px}
#search{margin-top:9px;width:100%;padding:9px 10px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:15px;outline:none}
#search::placeholder{color:rgba(255,255,255,.4)}
#pt-list{flex:1;overflow-y:auto;padding:5px 0}
#sidebar-footer{padding:10px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:7px}
.btn-new{width:100%;padding:12px;border-radius:9px;border:none;background:#4FC3B0;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn-reset{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer}

.pt-row{padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.pt-row.sel{background:rgba(79,195,176,.18);border-left-color:#4FC3B0}
.pt-avatar{width:36px;height:36px;border-radius:50%;background:#2E5C84;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.pt-row.sel .pt-avatar{background:#4FC3B0}
.pt-name{color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-sub{color:rgba(255,255,255,.4);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-bar{background:rgba(255,255,255,.1);border-radius:4px;height:3px;margin-top:4px}
.prog-fill{height:100%;border-radius:4px;background:#4FC3B0}
.prog-label{color:rgba(255,255,255,.3);font-size:11px;margin-top:2px}

/* PATIENT HEADER */
#pt-header{background:#fff;border-bottom:1px solid #E2E6EC;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
.pt-header-avatar{width:40px;height:40px;border-radius:50%;background:#1A3A5C;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
#tab-row{display:flex;gap:7px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tab-btn{padding:7px 13px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:#F0F2F5;color:#6B7A8D}
.tab-btn.active{background:#1A3A5C;color:#fff}
.badge{font-size:12px;background:#E5EFF7;color:#2C5F8A;padding:4px 10px;border-radius:20px;font-weight:600}
.btn-del{padding:6px 10px;border-radius:7px;border:1px solid #fca5a5;background:transparent;color:#C0392B;font-size:13px;cursor:pointer}
.desktop-collapse{background:#F0F2F5;border:none;color:#6B7A8D;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}

/* DIARIO */
#diario{flex:1;display:flex;flex-direction:column;overflow:hidden}
#diagnosis-bar{background:#EBF3FA;border-bottom:1px solid #D0E4F2;padding:7px 16px;font-size:13px;color:#2C5F8A;flex-shrink:0}
#chat-area{flex:1;overflow-y:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:10px}
.bubble-row{display:flex;gap:9px;align-items:flex-start}
.bubble-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px}
.bubble-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.type-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.bubble-time{color:#9AA3B0;font-size:11px}
.bubble{background:#fff;border-radius:0 10px 10px 10px;padding:11px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bubble-title{font-weight:600;font-size:13px;margin-bottom:4px}
.bubble-text{font-size:14px;line-height:1.65;color:#2D3748;white-space:pre-wrap}

/* FORM SESSIONE */
#add-area{background:#fff;border-top:1px solid #E2E6EC;padding:10px 14px;flex-shrink:0}
.btn-add-dashed{width:100%;padding:13px;border-radius:10px;border:2px dashed #C5D0DC;background:transparent;color:#6B7A8D;font-size:15px;cursor:pointer}
#session-form{display:flex;flex-direction:column;gap:9px}
.type-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.type-pill{padding:7px 12px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0;background:#F0F2F5;color:#6B7A8D}
.type-pill.active{outline:2px solid currentColor}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #D1D9E0;font-size:16px;outline:none;color:#1A2332;background:#fff;-webkit-appearance:none}
.form-btns{display:flex;gap:8px}
.btn-cancel{flex:1;padding:13px;border-radius:10px;border:1px solid #D1D9E0;background:#fff;color:#6B7A8D;font-size:15px;cursor:pointer}
.btn-save{flex:2;padding:13px;border-radius:10px;border:none;background:#1A3A5C;color:#fff;font-weight:700;font-size:15px;cursor:pointer}

/* SCHEDA */
#scheda{flex:1;overflow-y:auto;padding:14px}
.sec-title{font-size:10px;font-weight:700;color:#4FC3B0;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.info-card{background:#fff;border-radius:9px;padding:11px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.info-label{font-size:10px;color:#9AA3B0;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.info-val{font-size:13px;color:#1A2332;font-weight:500;word-break:break-word}
.btn-edit{padding:9px 14px;border-radius:10px;border:none;background:#1A3A5C;color:#fff;font-weight:600;font-size:14px;cursor:pointer}

/* FORM PAZIENTE */
#pt-form{flex:1;overflow-y:auto;padding:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.form-label{display:block;font-size:11px;font-weight:700;color:#6B7A8D;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}

/* EMPTY */
#empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#9AA3B0}
.saved-badge{font-size:10px;background:#4FC3B0;color:#fff;padding:2px 7px;border-radius:10px;margin-left:auto;font-weight:600}
#login{display:none;position:fixed;inset:0;z-index:200;background:#1A3A5C;align-items:center;justify-content:center;padding:20px}.login-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center}.login-box p{font-size:13px;color:#6B7A8D}#login-msg{color:#C0392B;font-size:13px;min-height:16px}
</style>
</head>
<body>
<div id="login"><div class="login-box"><div style="font-size:40px">🦴</div><h2 style="color:#1A3A5C">Fisioterapia</h2><p>Accedi per sincronizzare i dati su iPhone e PC</p><input class="inp" id="login-email" type="email" placeholder="Email" autocomplete="username"/><input class="inp" id="login-pass" type="password" placeholder="Password (min. 6 caratteri)" autocomplete="current-password"/><div id="login-msg"></div><button class="btn-save" id="btn-login" style="width:100%;flex:none">Accedi</button><button class="btn-cancel" id="btn-signup" style="width:100%;flex:none">Crea account (solo la prima volta)</button></div></div>
<div id="app">
  <div id="sidebar">

      <button class="btn-new" id="btn-new-pt">＋ Nuovo Paziente</button>
      <button class="btn-reset" id="btn-debiti" style="color:#F59E0B;border-color:rgba(245,158,11,.5);font-size:14px;padding:10px">💰 Da incassare</button>
      <div style="display:flex;gap:7px">

        <button class="btn-reset" id="btn-import-trigger" style="flex:1;color:#4FC3B0;border-color:rgba(79,195,176,.4)">⬆ Ripristina</button>

  <div id="overlay"></div>

  <div id="main">
    <!-- Mobile top bar -->
    <div id="mobile-topbar">
      <button class="hamburger" id="btn-hamburger">☰</button>
      <div id="topbar-info" style="flex:1;min-width:0"></div>
      <button id="btn-del-mobile" style="display:none;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer">🗑</button>
    </div>

    <!-- Desktop patient header -->
    <div id="pt-header" style="display:none">
      <button id="btn-expand" class="desktop-only" style="display:none;background:#1A3A5C;border:none;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px">☰</button>
      <div class="pt-header-avatar" id="hdr-avatar"></div>
      <div>
        <div id="hdr-name" style="font-weight:700;font-size:16px"></div>
        <div id="hdr-sub" style="color:#6B7A8D;font-size:12px"></div>
      </div>

    <!-- Views -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const KEY='fisio_v3';
const FB={apiKey:"AIzaSyDQnD3Rkj9k5m_bCOnIZZay2ea1SRJTdJk",authDomain:"fisioterapia-panico.firebaseapp.com",projectId:"fisioterapia-panico",storageBucket:"fisioterapia-panico.firebasestorage.app",messagingSenderId:"991105371365",appId:"1:991105371365:web:3777a8f8ef95821ea7580c"};
let db=null,auth=null,user=null,unsub=null,firstSnap=true;
try{firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){console.error(e)}
function colRef(){return db.collection('users').doc(user.uid).collection('pazienti')}
function push(p){save();if(db&&user)colRef().doc(String(p.id)).set(JSON.parse(JSON.stringify(p))).catch(e=>alert('Errore di sincronizzazione: '+e.message))}
function removeRemote(id){if(db&&user)colRef().doc(String(id)).delete().catch(e=>alert('Errore: '+e.message))}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return[]}
function showLogin(m){document.getElementById('login').style.display='flex';document.getElementById('login-msg').textContent=m||''}
function hideLogin(){document.getElementById('login').style.display='none'}
function doAuth(create){
  const e=document.getElementById('login-email').value.trim(),p=document.getElementById('login-pass').value;
  if(!e||!p)return showLogin('Inserisci email e password');
  (create?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).catch(err=>{
    const m={'auth/invalid-credential':'Email o password errate','auth/wrong-password':'Password errata','auth/user-not-found':'Account inesistente: usa "Crea account"','auth/email-already-in-use':'Email già registrata: usa "Accedi"','auth/weak-password':'Password troppo corta (min. 6 caratteri)','auth/invalid-email':'Email non valida','auth/operation-not-allowed':'Abilita Email/Password in Firebase → Authentication','auth/network-request-failed':'Nessuna connessione'};
    showLogin(m[err.code]||err.message)});
}
function logout(){if(!auth){alert('Modalità solo locale');return}if(confirm('Uscire dall\'account?'))auth.signOut()}
function startSync(){
  firstSnap=true;
  unsub=colRef().onSnapshot(snap=>{
    let cloud=snap.docs.map(d=>d.data());
    if(firstSnap&&!snap.metadata.fromCache){
      firstSnap=false;
      const local=loadLocal();
      if(!cloud.length&&local.length&&!localStorage.getItem('fisio_migrated')&&confirm('Sul cloud non ci sono ancora pazienti. Caricare i '+local.length+' pazienti salvati su questo dispositivo?')){local.forEach(push);cloud=local}
      localStorage.setItem('fisio_migrated','1');
    }
    cloud.sort((a,b)=>(a.cognome+a.nome).localeCompare(b.cognome+b.nome));
    patients=cloud;
    if(firstHome){firstHome=false;selId=null;curView='home'}else if(!patients.find(p=>p.id===selId)){selId=patients[0]?.id||null;curView=selId?'chat':'empty'}
    save();
    const busy=document.getElementById('session-form').style.display==='flex'||document.getElementById('pt-form').style.display==='block';
    busy?renderSidebar():renderAll();
  },err=>alert('Errore di sincronizzazione: '+err.message));
}

const ST={
  valutazione:{label:'Valutazione',color:'#2C5F8A',bg:'#E5EFF7',icon:'📋'},
  seduta:{label:'Seduta',color:'#2E7D5E',bg:'#E4F4EE',icon:'🙌'},
  esercizi:{label:'Esercizi dom.',color:'#6B46A0',bg:'#EDE8F7',icon:'🏃'},
  rivalutazione:{label:'Rivalutazione',color:'#B45309',bg:'#FEF3E2',icon:'🔄'},
  nota:{label:'Nota',color:'#555E6E',bg:'#F0F2F5',icon:'📝'},
};
const DISTRETTI=['Colonna cervicale','Colonna lombare','Colonna dorsale','Spalla dx','Spalla sx','Gomito dx','Gomito sx','Polso/Mano dx','Polso/Mano sx','Anca dx','Anca sx','Ginocchio dx','Ginocchio sx','Caviglia/Piede dx','Caviglia/Piede sx','Post-operatorio','Altro'];

function saveSession(){
  const testo=document.getElementById('sess-text').value.trim();if(!testo)return;
  const titolo=document.getElementById('sess-title').value.trim();
  const p=patients.find(x=>x.id===selId);if(!p)return;
  const n=sessType==='seduta'?countS(p.sessioni)+1:null;
  const imp=parseFloat(document.getElementById('pay-importo').value)||0,full=document.getElementById('pay-full').checked,acc=parseFloat(document.getElementById('pay-acconto').value)||0,ver=full?imp:acc;
  const pagamento=(imp||ver)?{importo:imp,versato:ver,pagato:full,metodo:document.getElementById('pay-metodo').value}:null;
  if(editSessId){const e=p.sessioni.find(x=>x.id===editSessId);if(e){e.tipo=sessType;e.titolo=titolo;e.testo=testo;e.pagamento=pagamento;if(sessType!=='seduta')e.numeroseduta=null}editSessId=null;document.getElementById('btn-save-sess').textContent='Salva'}
  else p.sessioni.push({id:Date.now(),data:new Date().toISOString(),tipo:sessType,titolo,testo,numeroseduta:n,pagamento});
  renum(p);
  const nd=document.getElementById('next-date').value;if(nd)createAppts(p,nd,document.getElementById('next-time').value,document.getElementById('next-rep').value);
  setTimeout(renderMain,0);
  push(p);resetPay();document.getElementById('sess-title').value='';document.getElementById('sess-text').value='';
  document.getElementById('session-form').style.display='none';document.getElementById('btn-show-form').style.display='';
  renderDiario(p);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function eur(n){return '€ '+n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtD(d){return d?new Date(d).toLocaleDateString('it-IT'):'—'}
function saldo(p){let d=0,v=0;(p.sessioni||[]).forEach(s=>{if(s.pagamento){d+=s.pagamento.importo||0;v+=s.pagamento.versato||0}});return{dovuto:d,versato:v,residuo:d-v}}
function payLine(s){const g=s.pagamento;if(!g)return'';const r=(g.importo||0)-(g.versato||0);
  return `<div style="margin-top:8px;padding-top:7px;border-top:1px dashed #E2E6EC;font-size:12px;font-weight:600;color:${r>0.004?'#C0392B':'#2E7D5E'}">💶 ${g.importo?'Importo '+eur(g.importo)+' · ':''}${g.pagato?'Pagato':'Versato '+eur(g.versato||0)} (${esc(g.metodo||'')})${r>0.004?' · Residuo '+eur(r):''}</div>`}
function resetPay(){['next-date','next-time','next-rep'].forEach(i=>document.getElementById(i).value='');['pay-importo','pay-acconto'].forEach(i=>document.getElementById(i).value='');document.getElementById('pay-full').checked=false;document.getElementById('pay-acconto').style.display=''}

    rows.map(x=>`<div class="info-card" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer" onclick="selectPatient(${x.p.id})"><div class="pt-header-avatar" style="width:36px;height:36px;font-size:13px">${initials(x.p)}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(x.p.cognome+' '+x.p.nome)}</div><div style="font-size:12px;color:#9AA3B0">${esc(x.p.distretto||'')}</div></div><div style="font-weight:700;color:#C0392B;font-size:15px">${eur(x.r)}</div></div>`).join('')
    :'<div style="text-align:center;color:#9AA3B0;margin-top:60px">Nessun pagamento in sospeso 🎉</div>');

const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],GG=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
let homeDay=new Date(),firstHome=true;
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function allAppts(){const r=[];patients.forEach(p=>(p.appuntamenti||[]).forEach(a=>r.push({p,a})));return r}
function setDay(k){homeDay=new Date(k+'T12:00:00');renderHome()}
function shiftDay(n){homeDay=new Date(homeDay.getTime());homeDay.setDate(homeDay.getDate()+n);renderHome()}
function shiftMonth(n){homeDay=new Date(homeDay.getFullYear(),homeDay.getMonth()+n,1,12);renderHome()}

function createAppts(p,date,ora,rep){p.appuntamenti=p.appuntamenti||[];const n=Math.max(0,Math.min(52,parseInt(rep)||0));
  for(let i=0;i<=n;i++){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+7*i);const k=iso(d);
    if(!p.appuntamenti.some(a=>a.data===k&&a.ora===(ora||'')))p.appuntamenti.push({id:Date.now()+i,data:k,ora:ora||''})}}
function delAppt(pid,aid){const p=patients.find(x=>x.id===pid);if(!p||!confirm('Eliminare questo appuntamento?'))return;p.appuntamenti=(p.appuntamenti||[]).filter(a=>a.id!==aid);push(p);renderHome()}
function addApptManual(){const p=patients.find(x=>x.id==document.getElementById('ap-pt').value),d=document.getElementById('ap-date').value;if(!p||!d)return alert('Scegli paziente e data');createAppts(p,d,document.getElementById('ap-time').value,document.getElementById('ap-rep').value);push(p);renderHome()}
let editSessId=null,wkOff=3;
function editSess(id){const p=patients.find(x=>x.id===selId),e=p&&p.sessioni.find(x=>x.id===id);if(!e)return;
  editSessId=id;sessType=e.tipo;resetPay();
  document.getElementById('sess-title').value=e.titolo||'';document.getElementById('sess-text').value=e.testo||'';
  const g=e.pagamento;if(g){document.getElementById('pay-importo').value=g.importo||'';document.getElementById('pay-full').checked=!!g.pagato;document.getElementById('pay-acconto').value=g.pagato?'':(g.versato||'');document.getElementById('pay-acconto').style.display=g.pagato?'none':'';if(g.metodo)document.getElementById('pay-metodo').value=g.metodo}
  document.getElementById('btn-save-sess').textContent='Salva modifiche';
  document.getElementById('session-form').style.display='flex';document.getElementById('btn-show-form').style.display='none';renderTypePills();
  document.getElementById('session-form').scrollIntoView({behavior:'smooth',block:'end'})}
function shiftWk(n){const t=document.getElementById('home').scrollTop;wkOff+=n;renderHome();document.getElementById('home').scrollTop=t}
function weekBoard(mon,ap,today,SL){
  let w='<div style="overflow-x:auto"><div style="display:grid;grid-template-columns:44px repeat(5,minmax(96px,1fr));gap:4px;min-width:540px"><div></div>';
  const dk=[];
  for(let i=0;i<5;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);dk.push(iso(d));w+=`<div style="text-align:center;font-weight:700;font-size:12px;padding:6px 0;border-radius:8px;color:#fff;background:${dk[i]===today?'#4FC3B0':'#1A3A5C'}">${GG[i]} ${d.getDate()}</div>`}
  const si=o=>{let r=0;SL.forEach((t,j)=>{if(o>=t)r=j});return r};
  SL.forEach((t,j)=>{w+=`<div style="font-size:11px;color:#6B7A8D;font-weight:600;padding-top:8px">${t}</div>`;
    dk.forEach(k=>{const l=ap.filter(x=>x.a.data===k&&si(x.a.ora||'')===j);
      w+=`<div onclick="slotClick('${k}','${t}')" style="min-height:44px;background:#fff;border-radius:8px;padding:3px;border:1px solid #E8ECF1;cursor:pointer">`+l.map(x=>`<div onclick="event.stopPropagation();selectPatient(${x.p.id})" style="background:#E4F4EE;color:#2E7D5E;border-radius:6px;padding:3px 5px;font-size:11px;font-weight:600;margin-bottom:2px;display:flex;justify-content:space-between;gap:3px"><span>${esc(x.p.cognome)}${x.a.ora&&x.a.ora!==t?' <small>'+x.a.ora+'</small>':''}</span><span onclick="event.stopPropagation();delAppt(${x.p.id},${x.a.id})" style="color:#C0392B">✕</span></div>`).join('')+'</div>'})});
  w+='</div></div>';
  const we=ap.filter(x=>{const df=Math.round((new Date(x.a.data+'T12:00:00')-mon)/864e5);return df>=5&&df<=6});
  if(we.length)w+='<div class="info-card" style="margin-top:8px;font-size:13px"><b>Weekend:</b> '+we.map(x=>x.a.data.slice(8)+'/'+x.a.data.slice(5,7)+' '+(x.a.ora||'')+' '+esc(x.p.cognome)).join(' · ')+'</div>';
  return w;
}
function renderHome(){
  const el=document.getElementById('home');el.style.display='block';
  document.getElementById('topbar-info').innerHTML='<div style="font-weight:700;font-size:15px">🏠 Home</div>';
  const ap=allAppts(),now=new Date(),today=iso(now),SL=slotList();
  const mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()+6)%7);mon.setHours(12,0,0,0);
  const mon2=new Date(mon);mon2.setDate(mon.getDate()+7);const mon3=new Date(mon);mon3.setDate(mon.getDate()+14);const mon4=new Date(mon);mon4.setDate(mon.getDate()+7*wkOff);
  const rng=m=>{const f=new Date(m);f.setDate(m.getDate()+4);return m.getDate()+' '+MESI[m.getMonth()].slice(0,3)+' – '+f.getDate()+' '+MESI[f.getMonth()].slice(0,3)};
  const GI=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const tod=ap.filter(x=>x.a.data===today).sort((a,b)=>(a.a.ora||'').localeCompare(b.a.ora||''));
  const rec=patients.map(p=>({p,t:(p.sessioni||[]).filter(x=>x.tipo==='seduta').map(x=>x.data).sort().pop()})).filter(x=>x.t).sort((a,b)=>b.t.localeCompare(a.t)).slice(0,5);
  el.innerHTML=`<div style="font-weight:700;font-size:19px;color:#1A3A5C;margin-bottom:14px">🏠 Home</div>
  <div class="sec-title">Oggi · ${GI[now.getDay()]} ${now.getDate()} ${MESI[now.getMonth()]} · ${tod.length} appuntament${tod.length==1?'o':'i'}</div>
  ${tod.length?tod.map(x=>`<div class="info-card" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer" onclick="selectPatient(${x.p.id})"><div style="font-weight:700;font-size:15px;color:#2E7D5E;min-width:52px">${x.a.ora||'—'}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(x.p.cognome+' '+x.p.nome)}</div><div style="font-size:12px;color:#9AA3B0">${esc(x.p.distretto||'')}</div></div><span onclick="event.stopPropagation();delAppt(${x.p.id},${x.a.id})" style="color:#C0392B;font-size:16px">✕</span></div>`).join(''):'<div style="color:#9AA3B0;font-size:13px;margin-bottom:8px">Nessun appuntamento oggi</div>'}
  <div class="sec-title" style="margin-top:16px">Ultimi pazienti trattati</div>
  ${rec.length?rec.map(x=>`<div class="info-card" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer" onclick="selectPatient(${x.p.id})"><div class="pt-header-avatar" style="width:36px;height:36px;font-size:13px">${initials(x.p)}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(x.p.cognome+' '+x.p.nome)}</div><div style="font-size:12px;color:#9AA3B0">${esc(x.p.distretto||'')}</div></div><div style="font-size:12px;color:#6B7A8D">${new Date(x.t).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}</div></div>`).join(''):'<div style="color:#9AA3B0;font-size:13px;margin-bottom:8px">Nessuna seduta registrata</div>'}
  <div class="sec-title" style="margin-top:16px">Piano trattamenti · settimana attuale (${rng(mon)})</div>
  ${slotEditor()}${weekBoard(mon,ap,today,SL)}
  <div class="sec-title" style="margin-top:16px">Settimana prossima (${rng(mon2)})</div>
  ${weekBoard(mon2,ap,today,SL)}
  <div class="sec-title" style="margin-top:16px">Tra due settimane (${rng(mon3)})</div>
  ${weekBoard(mon3,ap,today,SL)}
  <div class="sec-title" style="margin-top:16px">Scorri altre settimane</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><button class="tab-btn" onclick="shiftWk(-1)">‹</button><div style="font-weight:700;font-size:14px;color:#1A3A5C">${rng(mon4)}${wkOff===0?' · attuale':wkOff<0?' · '+(-wkOff)+' sett. fa':' · tra '+wkOff+' sett.'}</div><button class="tab-btn" onclick="shiftWk(1)">›</button></div>
  ${weekBoard(mon4,ap,today,SL)}
  <details id="ap-det" style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;color:#1A3A5C;padding:8px 0">＋ Nuovo appuntamento</summary><div style="display:flex;flex-direction:column;gap:8px;padding-top:6px">
  <select class="inp" id="ap-pt" style="appearance:auto;-webkit-appearance:menulist">${patients.map(p=>`<option value="${p.id}">${esc(p.cognome+' '+p.nome)}</option>`).join('')}</select>
  <div style="display:flex;gap:8px"><input class="inp" id="ap-date" type="date" value="${today}"/><input class="inp" id="ap-time" type="time"/></div>
  <input class="inp" id="ap-rep" type="number" inputmode="numeric" min="0" placeholder="Ripeti ogni settimana per altre … settimane (0 = no)"/>
  <button class="btn-save" style="flex:none" onclick="addApptManual()">Aggiungi</button></div></details>`;
}
function localInput(iso){const d=new Date(iso);if(isNaN(d))return'';d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function renum(p){let n=0;p.sessioni.forEach(s=>{if(s.tipo==='seduta')s.numeroseduta=++n})}
function chgSessDate(id,v){const p=patients.find(x=>x.id===selId),s=p&&p.sessioni.find(x=>x.id===id);if(!s||!v)return;s.data=new Date(v).toISOString();p.sessioni.sort((a,b)=>new Date(a.data)-new Date(b.data));renum(p);push(p);renderMain()}
function delSess(id){const p=patients.find(x=>x.id===selId);if(!p||!confirm('Eliminare questa voce dal diario?'))return;p.sessioni=p.sessioni.filter(x=>x.id!==id);renum(p);push(p);renderMain()}
function slotClick(k,t){const d=document.getElementById('ap-det');d.open=true;document.getElementById('ap-date').value=k;document.getElementById('ap-time').value=t;d.scrollIntoView({behavior:'smooth'})}
function slotList(){try{const a=JSON.parse(localStorage.getItem('fisio_slots'));if(Array.isArray(a)&&a.length)return a}catch(e){}return['08:00','09:00','10:00','11:00','15:00','16:00','17:00']}
function slotEditor(){return `<details style="margin-bottom:8px"><summary style="cursor:pointer;font-size:12px;color:#6B7A8D">⚙️ Modifica fasce orarie</summary><div style="display:flex;gap:8px;padding-top:6px"><input class="inp" id="sl-txt" value="${slotList().join(', ')}" placeholder="08:00, 09:30, 11:00…"/><button class="btn-save" style="flex:none;padding:10px 14px" onclick="saveSlots()">Salva</button></div></details>`}
function saveSlots(){const a=document.getElementById('sl-txt').value.split(/[,;\s]+/).map(t=>t.trim()).filter(t=>/^\d{1,2}[:.]\d{2}$/.test(t)).map(t=>{const[h,m]=t.replace('.',':').split(':');return h.padStart(2,'0')+':'+m}).sort();if(!a.length||a.length>16)return alert('Inserisci da 1 a 16 orari, es. 08:00, 09:30');localStorage.setItem('fisio_slots',JSON.stringify([...new Set(a)]));renderHome()}
function exportBackup(){
  const date=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify(patients,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='fisioterapia-backup-'+date+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function importBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data))throw new Error();
      if(!confirm('Importare '+data.length+' pazienti? I pazienti verranno aggiunti o aggiornati.'))return;
      patients=data;data.forEach(push);selId=patients[0]?.id||null;curView=selId?'chat':'empty';
      save();renderAll();
      alert('✅ Backup ripristinato con successo!');
    }catch(err){alert('❌ File non valido. Assicurati di usare un backup esportato da questa app.')}
  };
  reader.readAsText(file);
}

// Events
document.getElementById('search').addEventListener('input',renderSidebar);
document.getElementById('btn-new-pt').onclick=startNewPatient;
document.getElementById('btn-reset').onclick=logout;
document.getElementById('btn-export').onclick=exportBackup;
document.getElementById('btn-import-trigger').onclick=()=>document.getElementById('btn-import').click();
document.getElementById('btn-import').onchange=e=>importBackup(e.target.files[0]);
document.getElementById('btn-hamburger').onclick=openSidebar;
document.getElementById('overlay').onclick=closeSidebar;
document.getElementById('btn-collapse').onclick=()=>{sidebarCollapsed=true;document.getElementById('sidebar').classList.add('collapsed');document.getElementById('btn-expand').style.display=''};
document.getElementById('btn-expand').onclick=()=>{sidebarCollapsed=false;document.getElementById('sidebar').classList.remove('collapsed');document.getElementById('btn-expand').style.display='none'};
document.getElementById('btn-show-form').onclick=()=>{document.getElementById('session-form').style.display='flex';document.getElementById('btn-show-form').style.display='none';renderTypePills()};
document.getElementById('btn-cancel-sess').onclick=()=>{editSessId=null;document.getElementById('btn-save-sess').textContent='Salva';resetPay();document.getElementById('sess-title').value='';document.getElementById('sess-text').value='';document.getElementById('session-form').style.display='none';document.getElementById('btn-show-form').style.display=''};
document.getElementById('btn-save-sess').onclick=saveSession;

// Init
if(auth){
  document.getElementById('btn-login').onclick=()=>doAuth(false);
  document.getElementById('btn-signup').onclick=()=>doAuth(true);
  auth.onAuthStateChanged(u=>{user=u;if(unsub){unsub();unsub=null}
    if(u){hideLogin();startSync()}else{patients=[];selId=null;curView='empty';renderAll();showLogin()}});
}else{patients=loadLocal();selId=patients[0]?.id||null;curView=selId?'chat':'empty';renderAll()}
</script>
</body>
</html>
