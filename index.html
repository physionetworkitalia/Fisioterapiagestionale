<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1A3A5C"/>
<title>🦴 Fisioterapia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F5F9;color:#1A2332;font-size:16px}
input,textarea,select,button{font-family:inherit;font-size:16px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#C5D0DC;border-radius:4px}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden;position:relative}

/* SIDEBAR */
#sidebar{
  width:272px;min-width:272px;background:#1A3A5C;
  display:flex;flex-direction:column;overflow:hidden;
  transition:min-width .25s,width .25s;
  flex-shrink:0;
}
#sidebar.collapsed{width:0!important;min-width:0!important}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}

/* MOBILE */
@media(max-width:680px){
  #sidebar{
    position:fixed;inset:0;width:100%!important;min-width:100%!important;
    z-index:100;transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    padding-top:env(safe-area-inset-top);
  }
  #sidebar.mobile-open{transform:translateX(0)!important}
  #sidebar.collapsed{transform:translateX(-100%)!important}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
  #overlay.show{display:block}
  #mobile-topbar{display:flex!important}
  #bottom-nav{display:flex!important;padding-bottom:env(safe-area-inset-bottom)}
  #main{padding-bottom:56px}
  .desktop-only{display:none!important}
}
@media(min-width:681px){
  #mobile-topbar{display:none!important}
  #bottom-nav{display:none!important}
  .mobile-only{display:none!important}
}

#mobile-topbar{
  display:none;background:#1A3A5C;color:#fff;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  align-items:center;gap:12px;flex-shrink:0;
}
.hamburger{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px;line-height:1}

#bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid #E2E6EC;z-index:50;
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;border:none;background:transparent;cursor:pointer;
  font-size:10px;font-weight:600;color:#9AA3B0;gap:2px;
}
.bnav-btn.active{color:#1A3A5C}
.bnav-icon{font-size:20px;line-height:1.2}

/* SIDEBAR INNER */
#sidebar-header{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar-title{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
#sidebar-sub{color:rgba(255,255,255,.4);font-size:11px}
#search{margin-top:9px;width:100%;padding:9px 10px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:15px;outline:none}
#search::placeholder{color:rgba(255,255,255,.4)}
#pt-list{flex:1;overflow-y:auto;padding:5px 0}
#sidebar-footer{padding:10px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:7px}
.btn-new{width:100%;padding:12px;border-radius:9px;border:none;background:#4FC3B0;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn-reset{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer}

.pt-row{padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.pt-row.sel{background:rgba(79,195,176,.18);border-left-color:#4FC3B0}
.pt-avatar{width:36px;height:36px;border-radius:50%;background:#2E5C84;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.pt-row.sel .pt-avatar{background:#4FC3B0}
.pt-name{color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-sub{color:rgba(255,255,255,.4);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-bar{background:rgba(255,255,255,.1);border-radius:4px;height:3px;margin-top:4px}
.prog-fill{height:100%;border-radius:4px;background:#4FC3B0}
.prog-label{color:rgba(255,255,255,.3);font-size:11px;margin-top:2px}

/* PATIENT HEADER */
#pt-header{background:#fff;border-bottom:1px solid #E2E6EC;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
.pt-header-avatar{width:40px;height:40px;border-radius:50%;background:#1A3A5C;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
#tab-row{display:flex;gap:7px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tab-btn{padding:7px 13px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:#F0F2F5;color:#6B7A8D}
.tab-btn.active{background:#1A3A5C;color:#fff}
.badge{font-size:12px;background:#E5EFF7;color:#2C5F8A;padding:4px 10px;border-radius:20px;font-weight:600}
.btn-del{padding:6px 10px;border-radius:7px;border:1px solid #fca5a5;background:transparent;color:#C0392B;font-size:13px;cursor:pointer}
.desktop-collapse{background:#F0F2F5;border:none;color:#6B7A8D;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}

/* DIARIO */
#diario{flex:1;display:flex;flex-direction:column;overflow:hidden}
#diagnosis-bar{background:#EBF3FA;border-bottom:1px solid #D0E4F2;padding:7px 16px;font-size:13px;color:#2C5F8A;flex-shrink:0}
#chat-area{flex:1;overflow-y:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:10px}
.bubble-row{display:flex;gap:9px;align-items:flex-start}
.bubble-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px}
.bubble-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.type-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.bubble-time{color:#9AA3B0;font-size:11px}
.bubble{background:#fff;border-radius:0 10px 10px 10px;padding:11px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bubble-title{font-weight:600;font-size:13px;margin-bottom:4px}
.bubble-text{font-size:14px;line-height:1.65;color:#2D3748;white-space:pre-wrap}

/* FORM SESSIONE */
#add-area{background:#fff;border-top:1px solid #E2E6EC;padding:10px 14px;flex-shrink:0}
.btn-add-dashed{width:100%;padding:13px;border-radius:10px;border:2px dashed #C5D0DC;background:transparent;color:#6B7A8D;font-size:15px;cursor:pointer}
#session-form{display:flex;flex-direction:column;gap:9px}
.type-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.type-pill{padding:7px 12px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0;background:#F0F2F5;color:#6B7A8D}
.type-pill.active{outline:2px solid currentColor}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #D1D9E0;font-size:16px;outline:none;color:#1A2332;background:#fff;-webkit-appearance:none}
.form-btns{display:flex;gap:8px}
.btn-cancel{flex:1;padding:13px;border-radius:10px;border:1px solid #D1D9E0;background:#fff;color:#6B7A8D;font-size:15px;cursor:pointer}
.btn-save{flex:2;padding:13px;border-radius:10px;border:none;background:#1A3A5C;color:#fff;font-weight:700;font-size:15px;cursor:pointer}

/* SCHEDA */
#scheda{flex:1;overflow-y:auto;padding:14px}
.sec-title{font-size:10px;font-weight:700;color:#4FC3B0;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.info-card{background:#fff;border-radius:9px;padding:11px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.info-label{font-size:10px;color:#9AA3B0;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.info-val{font-size:13px;color:#1A2332;font-weight:500;word-break:break-word}
.btn-edit{padding:9px 14px;border-radius:10px;border:none;background:#1A3A5C;color:#fff;font-weight:600;font-size:14px;cursor:pointer}

/* FORM PAZIENTE */
#pt-form{flex:1;overflow-y:auto;padding:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.form-label{display:block;font-size:11px;font-weight:700;color:#6B7A8D;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}

/* EMPTY */
#empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#9AA3B0}
.saved-badge{font-size:10px;background:#4FC3B0;color:#fff;padding:2px 7px;border-radius:10px;margin-left:auto;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">
        <span>🦴</span><span>Fisioterapia</span>
        <span id="saved-badge" class="saved-badge" style="display:none">✓</span>
        <button id="btn-collapse" class="desktop-only" style="margin-left:auto;background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px">◀</button>
      </div>
      <div id="sidebar-sub"></div>
      <input id="search" placeholder="Cerca…" type="search"/>
    </div>
    <div id="pt-list"></div>
    <div id="sidebar-footer">
      <button class="btn-new" id="btn-new-pt">＋ Nuovo Paziente</button>
      <button class="btn-reset" id="btn-reset">Ripristina demo</button>
    </div>
  </div>

  <div id="overlay"></div>

  <div id="main">
    <!-- Mobile top bar -->
    <div id="mobile-topbar">
      <button class="hamburger" id="btn-hamburger">☰</button>
      <div id="topbar-info" style="flex:1;min-width:0"></div>
      <button id="btn-del-mobile" style="display:none;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer">🗑</button>
    </div>

    <!-- Desktop patient header -->
    <div id="pt-header" style="display:none">
      <button id="btn-expand" class="desktop-only" style="display:none;background:#1A3A5C;border:none;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px">☰</button>
      <div class="pt-header-avatar" id="hdr-avatar"></div>
      <div>
        <div id="hdr-name" style="font-weight:700;font-size:16px"></div>
        <div id="hdr-sub" style="color:#6B7A8D;font-size:12px"></div>
      </div>
      <div id="tab-row">
        <span id="hdr-badge" class="badge" style="display:none"></span>
        <button class="tab-btn active" id="tab-chat" onclick="switchView('chat')">📋 Diario</button>
        <button class="tab-btn" id="tab-anagrafica" onclick="switchView('anagrafica')">👤 Scheda</button>
        <button class="btn-del" id="btn-del-desktop">🗑</button>
      </div>
    </div>

    <!-- Views -->
    <div id="diario" style="display:none">
      <div id="diagnosis-bar" style="display:none"></div>
      <div id="chat-area"></div>
      <div id="add-area">
        <button class="btn-add-dashed" id="btn-show-form">＋ Registra seduta, esercizi o nota…</button>
        <div id="session-form" style="display:none">
          <div class="type-pills" id="type-pills"></div>
          <input class="inp" id="sess-title" placeholder="Titolo (opzionale)"/>
          <textarea class="inp" id="sess-text" rows="3" placeholder="Tecniche, NRS dolore, ROM, risposta del paziente…" style="resize:none"></textarea>
          <div class="form-btns">
            <button class="btn-cancel" id="btn-cancel-sess">Annulla</button>
            <button class="btn-save" id="btn-save-sess">Salva</button>
          </div>
        </div>
      </div>
    </div>

    <div id="scheda" style="display:none"></div>
    <div id="pt-form" style="display:none"></div>
    <div id="empty">
      <div style="font-size:48px">🦴</div>
      <div style="font-size:15px">Seleziona un paziente</div>
      <button class="btn-new mobile-only" style="margin-top:8px;padding:10px 20px;font-size:14px" onclick="openSidebar()">Apri lista pazienti</button>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav id="bottom-nav">
    <button class="bnav-btn active" id="bnav-chat" onclick="switchView('chat')"><span class="bnav-icon">📋</span>Diario</button>
    <button class="bnav-btn" id="bnav-anagrafica" onclick="switchView('anagrafica')"><span class="bnav-icon">👤</span>Scheda</button>
    <button class="bnav-btn" onclick="openSidebar()"><span class="bnav-icon">👥</span>Pazienti</button>
    <button class="bnav-btn" onclick="startNewPatient()"><span class="bnav-icon">＋</span>Nuovo</button>
  </nav>
</div>

<script>
const KEY='fisio_v3';
const ST={
  valutazione:{label:'Valutazione',color:'#2C5F8A',bg:'#E5EFF7',icon:'📋'},
  seduta:{label:'Seduta',color:'#2E7D5E',bg:'#E4F4EE',icon:'🙌'},
  esercizi:{label:'Esercizi dom.',color:'#6B46A0',bg:'#EDE8F7',icon:'🏃'},
  rivalutazione:{label:'Rivalutazione',color:'#B45309',bg:'#FEF3E2',icon:'🔄'},
  nota:{label:'Nota',color:'#555E6E',bg:'#F0F2F5',icon:'📝'},
};
const DISTRETTI=['Colonna cervicale','Colonna lombare','Colonna dorsale','Spalla dx','Spalla sx','Gomito dx','Gomito sx','Polso/Mano dx','Polso/Mano sx','Anca dx','Anca sx','Ginocchio dx','Ginocchio sx','Caviglia/Piede dx','Caviglia/Piede sx','Post-operatorio','Altro'];
const DEMO=[{id:1,nome:'Laura',cognome:'Bianchi',dataNascita:'1980-06-24',codiceFiscale:'BNCLRA80H64F205Z',telefono:'347 9876543',email:'laura.bianchi@email.it',indirizzo:'Via Verdi 8, Torino',medicoInviante:'Dr. Ferretti',patologia:'Lombalgia cronica con irradiazione arto inferiore dx (L4-L5)',distretto:'Colonna lombare',sedutePrescritte:'12',anamnesi:'Dolore da 8 mesi. RMN: protrusione discale L4-L5.',obiettivi:'Riduzione dolore, rinforzo core, ripristino schema motorio',note:'Lavoro ufficio 8h/die.',sessioni:[
  {id:1,data:'2024-03-04T09:00',tipo:'valutazione',titolo:'Valutazione iniziale',testo:'Test Lasègue positivo a 45° dx. ROM lombare ridotto. Ipertono paravertebrale bilaterale. NRS: 7/10.',numeroseduta:0},
  {id:2,data:'2024-03-07T09:00',tipo:'seduta',titolo:'Seduta 1 – Mobilizzazione',testo:'Terapia manuale L3-L5. TENS lombosacrale 20\'. Respirazione diaframmatica. NRS fine seduta: 5/10.',numeroseduta:1},
  {id:3,data:'2024-03-07T09:45',tipo:'esercizi',titolo:'Programma domiciliare',testo:'Cat-Cow 2x10, Bird-Dog 2x8 per lato, stretching piriforme 3x30s. Mattino e sera.',numeroseduta:null},
  {id:4,data:'2024-03-11T09:00',tipo:'seduta',titolo:'Seduta 2 – Rinforzo core',testo:'Plank ginocchia 3x20s. Rinforzo glutei theraband. NRS 4/10.',numeroseduta:2},
  {id:5,data:'2024-03-21T09:00',tipo:'rivalutazione',titolo:'Rivalutazione a 3 sedute',testo:'Lasègue 65° dx. ROM +20°. NRS 3/10 a riposo.',numeroseduta:3},
]}];

let patients=[], selId=null, curView='empty', sessType='seduta', sidebarCollapsed=false;

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(DEMO))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(patients));showSaved()}catch(e){}}
function showSaved(){const b=document.getElementById('saved-badge');b.style.display='';setTimeout(()=>b.style.display='none',1500)}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
function age(dob){if(!dob)return'—';return Math.floor((Date.now()-new Date(dob))/(365.25*864e5))+' anni'}
function countS(s){return(s||[]).filter(x=>x.tipo==='seduta').length}
function initials(p){return p.cognome[0]+p.nome[0]}
function isMobile(){return window.innerWidth<=680}

function openSidebar(){
  const s=document.getElementById('sidebar');
  s.classList.add('mobile-open');s.classList.remove('collapsed');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar(){
  const s=document.getElementById('sidebar');
  s.classList.remove('mobile-open');
  document.getElementById('overlay').classList.remove('show');
}

function renderSidebar(){
  const search=document.getElementById('search').value.toLowerCase();
  document.getElementById('sidebar-sub').textContent=patients.length+' pazienti • dati salvati';
  const list=document.getElementById('pt-list');
  const filtered=patients.filter(p=>(p.cognome+' '+p.nome).toLowerCase().includes(search)||( p.patologia||'').toLowerCase().includes(search));
  list.innerHTML=filtered.map(p=>{
    const done=countS(p.sessioni),total=parseInt(p.sedutePrescritte)||0,pct=total?Math.min(100,Math.round(done/total*100)):null;
    const sel=p.id===selId;
    return `<div class="pt-row${sel?' sel':''}" onclick="selectPatient(${p.id})">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="pt-avatar">${initials(p)}</div>
        <div style="flex:1;min-width:0">
          <div class="pt-name">${p.cognome} ${p.nome}</div>
          <div class="pt-sub">${p.distretto||p.patologia?.slice(0,24)||'—'}</div>
          ${pct!==null?`<div class="prog-bar"><div class="prog-fill" style="width:${pct}%;${pct>=100?'background:#F59E0B':''}"></div></div><div class="prog-label">${done}/${total} sedute</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function selectPatient(id){
  selId=id; curView='chat';
  if(isMobile())closeSidebar();
  renderAll();
}

function switchView(v){
  if(!selId)return;
  curView=v;
  renderMain();
  // sync tab btns
  ['chat','anagrafica'].forEach(t=>{
    document.getElementById('tab-'+t)?.classList.toggle('active',t===v);
    const bn=document.getElementById('bnav-'+t);
    if(bn)bn.classList.toggle('active',t===v);
  });
}

function renderAll(){
  renderSidebar();
  renderMain();
}

function renderMain(){
  const p=patients.find(x=>x.id===selId);
  // hide all views
  ['diario','scheda','pt-form','empty'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('pt-header').style.display='none';
  document.getElementById('mobile-topbar').querySelector('#btn-del-mobile').style.display='none';

  if(curView==='new-patient'){
    renderPtForm(null);
    document.getElementById('pt-form').style.display='block';
    // mobile topbar
    document.getElementById('topbar-info').innerHTML='<div style="font-weight:700;font-size:15px">Nuovo Paziente</div>';
    return;
  }
  if(!p){document.getElementById('empty').style.display='flex';return;}

  // Patient header (desktop)
  const hdr=document.getElementById('pt-header');
  hdr.style.display='flex';
  document.getElementById('hdr-avatar').textContent=initials(p);
  document.getElementById('hdr-name').textContent=p.cognome+' '+p.nome;
  document.getElementById('hdr-sub').textContent=[age(p.dataNascita),p.distretto,p.medicoInviante?'Inv. '+p.medicoInviante:''].filter(Boolean).join(' • ');
  const badge=document.getElementById('hdr-badge');
  if(p.sedutePrescritte){badge.style.display='';badge.textContent=countS(p.sessioni)+'/'+p.sedutePrescritte+' sedute'}else{badge.style.display='none'}
  document.getElementById('btn-del-desktop').onclick=()=>delPatient(p.id);
  document.getElementById('btn-del-mobile').style.display='';
  document.getElementById('btn-del-mobile').onclick=()=>delPatient(p.id);
  // expand btn
  const exp=document.getElementById('btn-expand');
  exp.style.display=sidebarCollapsed?'':'none';

  // Mobile topbar
  document.getElementById('topbar-info').innerHTML=`<div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.cognome} ${p.nome}</div><div style="font-size:11px;color:rgba(255,255,255,.55)">${p.distretto||'—'}${p.sedutePrescritte?' • '+countS(p.sessioni)+'/'+p.sedutePrescritte+' sedute':''}</div>`;

  if(curView==='chat') renderDiario(p);
  else if(curView==='anagrafica') renderScheda(p);
}

function renderDiario(p){
  document.getElementById('diario').style.display='flex';
  const db=document.getElementById('diagnosis-bar');
  if(p.patologia){db.style.display='';db.innerHTML='<strong>Diagnosi:</strong> '+esc(p.patologia)}else{db.style.display='none'}
  const area=document.getElementById('chat-area');
  if(!p.sessioni.length){area.innerHTML='<div style="text-align:center;color:#9AA3B0;margin-top:60px;font-size:14px">Nessuna sessione.<br><span style="font-size:12px">Inizia con una valutazione iniziale.</span></div>';return;}
  area.innerHTML=p.sessioni.map(s=>{
    const st=ST[s.tipo]||ST.nota;
    return `<div class="bubble-row">
      <div class="bubble-icon" style="background:${st.bg}">${st.icon}</div>
      <div style="flex:1">
        <div class="bubble-meta">
          <span class="type-tag" style="background:${st.bg};color:${st.color}">${st.label}${s.numeroseduta?' #'+s.numeroseduta:''}</span>
          <span class="bubble-time">${fmtDate(s.data)}</span>
        </div>
        <div class="bubble" style="border:1px solid ${st.bg}">
          ${s.titolo?`<div class="bubble-title" style="color:${st.color}">${esc(s.titolo)}</div>`:''}
          <div class="bubble-text">${esc(s.testo)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  area.scrollTop=area.scrollHeight;
  // reset form
  document.getElementById('session-form').style.display='none';
  document.getElementById('btn-show-form').style.display='';
  renderTypePills();
}

function renderTypePills(){
  document.getElementById('type-pills').innerHTML=Object.entries(ST).map(([k,v])=>`<button class="type-pill${k===sessType?' active':''}" style="${k===sessType?'background:'+v.bg+';color:'+v.color+';outline:2px solid '+v.color:''}" onclick="setType('${k}')">${v.icon} ${v.label}</button>`).join('');
}
function setType(t){sessType=t;renderTypePills()}

function renderScheda(p){
  const el=document.getElementById('scheda');
  el.style.display='block';
  const ana=[['Nome completo',p.cognome+' '+p.nome],['Data di nascita',p.dataNascita?new Date(p.dataNascita).toLocaleDateString('it-IT'):'—'],['Età',age(p.dataNascita)],['Cod. fiscale',p.codiceFiscale||'—'],['Telefono',p.telefono||'—'],['Email',p.email||'—'],['Indirizzo',p.indirizzo||'—']];
  const cli=[['Medico inviante',p.medicoInviante||'—'],['Distretto',p.distretto||'—'],['Sedute prescritte',p.sedutePrescritte||'—'],['Patologia',p.patologia||'—'],['Obiettivi',p.obiettivi||'—'],['Anamnesi',p.anamnesi||'—'],['Note',p.note||'—']];
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-weight:700;font-size:17px;color:#1A3A5C">Scheda paziente</div>
      <button class="btn-edit" onclick="startEditPatient()">✏️ Modifica</button>
    </div>
    <div class="sec-title">Anagrafica</div>
    <div class="info-grid">${ana.map(([l,v])=>`<div class="info-card"><div class="info-label">${l}</div><div class="info-val">${esc(v)}</div></div>`).join('')}</div>
    <div class="sec-title">Dati clinici</div>
    <div class="info-grid">${cli.map(([l,v])=>`<div class="info-card"><div class="info-label">${l}</div><div class="info-val">${esc(v)}</div></div>`).join('')}</div>
  `;
}

function ptFormHTML(data){
  const v=k=>esc(data[k]||'');
  const inp=(k,l,t='text')=>`<div><label class="form-label">${l}</label><input class="inp" type="${t}" id="f-${k}" value="${v(k)}"/></div>`;
  const ta=(k,l)=>`<div style="margin-bottom:9px"><label class="form-label">${l}</label><textarea class="inp" id="f-${k}" rows="2" style="resize:none">${esc(data[k]||'')}</textarea></div>`;
  const sel=`<div><label class="form-label">Distretto trattato</label><select class="inp" id="f-distretto" style="appearance:auto;-webkit-appearance:menulist"><option value="">— Seleziona —</option>${DISTRETTI.map(d=>`<option${data.distretto===d?' selected':''}>${d}</option>`).join('')}</select></div>`;
  return `
    <div class="sec-title">Anagrafica</div>
    <div class="form-grid">
      ${inp('cognome','Cognome *')}${inp('nome','Nome *')}
      ${inp('dataNascita','Data di nascita','date')}${inp('codiceFiscale','Codice fiscale')}
      ${inp('telefono','Telefono','tel')}${inp('email','Email','email')}
      ${inp('indirizzo','Indirizzo')}
    </div>
    <div class="sec-title" style="margin-top:8px">Dati clinici</div>
    <div class="form-grid">
      ${inp('medicoInviante','Medico inviante')}${inp('sedutePrescritte','Sedute prescritte','number')}
      ${sel}
    </div>
    ${ta('patologia','Patologia / Diagnosi')}
    ${ta('anamnesi','Anamnesi')}
    ${ta('obiettivi','Obiettivi terapeutici')}
    ${ta('note','Note')}
  `;
}

function getFormData(){
  const fields=['cognome','nome','dataNascita','codiceFiscale','telefono','email','indirizzo','medicoInviante','sedutePrescritte','distretto','patologia','anamnesi','obiettivi','note'];
  const d={};fields.forEach(k=>{const el=document.getElementById('f-'+k);if(el)d[k]=el.value});
  return d;
}

function renderPtForm(p){
  const el=document.getElementById('pt-form');
  const isNew=!p;
  const data=p||{};
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      ${!isNew?'<button onclick="cancelEdit()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#1A3A5C">←</button>':''}
      <div style="font-weight:700;font-size:17px;color:#1A3A5C">${isNew?'Nuovo Paziente':'Modifica scheda'}</div>
    </div>
    ${ptFormHTML(data)}
    <div class="form-btns" style="margin-top:14px">
      <button class="btn-cancel" onclick="${isNew?'cancelNew()':'cancelEdit()'}">Annulla</button>
      <button class="btn-save" onclick="${isNew?'saveNewPatient()':'saveEditPatient()'}">${isNew?'Crea Paziente':'Salva modifiche'}</button>
    </div>
  `;
}

function startNewPatient(){curView='new-patient';renderPtForm(null);document.getElementById('pt-form').style.display='block';['diario','scheda','empty','pt-header'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('topbar-info').innerHTML='<div style="font-weight:700;font-size:15px">Nuovo Paziente</div>';if(isMobile())closeSidebar()}
function cancelNew(){curView=selId?'chat':'empty';renderMain()}
function saveNewPatient(){
  const d=getFormData();if(!d.cognome||!d.nome)return alert('Inserisci nome e cognome');
  const p={...d,id:Date.now(),sessioni:[]};patients.push(p);selId=p.id;curView='chat';save();renderAll();
}
function startEditPatient(){const p=patients.find(x=>x.id===selId);document.getElementById('scheda').style.display='none';renderPtForm(p);document.getElementById('pt-form').style.display='block'}
function cancelEdit(){document.getElementById('pt-form').style.display='none';curView='anagrafica';renderMain()}
function saveEditPatient(){
  const d=getFormData();const i=patients.findIndex(x=>x.id===selId);if(i<0)return;
  patients[i]={...patients[i],...d};save();curView='anagrafica';renderAll();
}
function delPatient(id){
  if(!confirm('Eliminare questo paziente e tutte le sessioni?'))return;
  patients=patients.filter(p=>p.id!==id);
  selId=patients[0]?.id||null;curView=selId?'chat':'empty';save();renderAll();
}

function saveSession(){
  const testo=document.getElementById('sess-text').value.trim();if(!testo)return;
  const titolo=document.getElementById('sess-title').value.trim();
  const p=patients.find(x=>x.id===selId);if(!p)return;
  const n=sessType==='seduta'?countS(p.sessioni)+1:null;
  p.sessioni.push({id:Date.now(),data:new Date().toISOString(),tipo:sessType,titolo,testo,numeroseduta:n});
  save();document.getElementById('sess-title').value='';document.getElementById('sess-text').value='';
  document.getElementById('session-form').style.display='none';document.getElementById('btn-show-form').style.display='';
  renderDiario(p);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Events
document.getElementById('search').addEventListener('input',renderSidebar);
document.getElementById('btn-new-pt').onclick=startNewPatient;
document.getElementById('btn-reset').onclick=()=>{if(!confirm('Ripristinare il paziente demo?'))return;patients=JSON.parse(JSON.stringify(DEMO));selId=DEMO[0].id;curView='chat';save();renderAll()};
document.getElementById('btn-hamburger').onclick=openSidebar;
document.getElementById('overlay').onclick=closeSidebar;
document.getElementById('btn-collapse').onclick=()=>{sidebarCollapsed=true;document.getElementById('sidebar').classList.add('collapsed');document.getElementById('btn-expand').style.display=''};
document.getElementById('btn-expand').onclick=()=>{sidebarCollapsed=false;document.getElementById('sidebar').classList.remove('collapsed');document.getElementById('btn-expand').style.display='none'};
document.getElementById('btn-show-form').onclick=()=>{document.getElementById('session-form').style.display='flex';document.getElementById('btn-show-form').style.display='none';renderTypePills()};
document.getElementById('btn-cancel-sess').onclick=()=>{document.getElementById('session-form').style.display='none';document.getElementById('btn-show-form').style.display=''};
document.getElementById('btn-save-sess').onclick=saveSession;

// Init
patients=load();selId=patients[0]?.id||null;curView=selId?'chat':'empty';
renderAll();
</script>
</body>
</html>
